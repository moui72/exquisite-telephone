name: Promote main to release

# Manual promotion only, and the ONLY path that deploys prod (Railway
# project `exquisite-telephone`, service `web`, environment `production`). `release` only ever receives a fast-forward of
# `main`; this workflow performs that fast-forward AND the deploy in one
# run, replacing both the remembered `git push origin main:release` and
# the push-triggered deploy-prod job ci.yml used to carry.
#
# Re-dispatching when release is already current is harmless: the push is
# a no-op ("Everything up-to-date") and the deploy simply re-ships the
# same tree.
on:
  # No inputs. The version is whatever `package.json` on main says: a
  # release is cut by first merging a `chore(release): vX.Y.Z` PR that bumps
  # it (infrastructure.md — App Versioning). This workflow never writes to
  # main, because the `main` ruleset only accepts changes through a PR and
  # a personal repo can't let Actions bypass that.
  workflow_dispatch:

# Two dispatches must not race each other onto the same branch, nor into
# the same Railway service. This group covers the fast-forward AND the deploy,
# which is why it is not the `deploy-prod` group ci.yml used to hold.
concurrency:
  group: promote-release
  cancel-in-progress: false

# The built-in GITHUB_TOKEN needs write access to push `release` and the
# release tag.
permissions:
  contents: write

jobs:
  promote:
    name: Fast-forward release to main, then deploy prod
    runs-on: ubuntu-latest
    # A normal run is a few minutes; fail a hung deploy instead of holding a
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # A shallow clone cannot compute fast-forwardness — git needs the
          # full history of both branches to know whether release is an
          # ancestor of main.
          fetch-depth: 0

      # There is no e2e precondition here today. It required a green
      # `e2e/cross-browser` status recorded after a beta deploy, and the beta
      # channel was dropped in the move from Fly.io to Railway
      # (infrastructure.md — Deployment). Bring it back with beta.

      # Read the release version from main, and refuse to re-use a version
      # that was already released from a different commit: that means the
      # bump PR was forgotten. A tag that already points at main HEAD is a
      # re-dispatch of the same release, which re-deploys it.
      - name: Read the release version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if [ "$(git rev-list -n 1 "${tag}")" = "$(git rev-parse HEAD)" ]; then
              echo "${tag} already points at main HEAD; re-deploying it"
              echo "retag=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${tag} was already released from another commit. Merge a PR bumping package.json (chore(release): vX.Y.Z) first."
            exit 1
          fi
          echo "retag=true" >> "$GITHUB_OUTPUT"

      - name: Push main to release (fast-forward only)
        run: |
          set -euo pipefail

          # A plain, non-force push. Git itself rejects a non-fast-forward
          # update, which is exactly the behaviour we want: divergence means
          # release holds a commit main does not have, and that commit never
          # passed `checks` on main. That invariant is what lets release skip
          # CI, so a human must resolve it — this workflow must never merge
          # and never force-push.
          if git push origin main:release; then
            echo "release fast-forwarded to $(git rev-parse --short main)"
            exit 0
          fi

          echo "::error::Promotion aborted: release could not be fast-forwarded from main."
          cat >&2 <<'MSG'

          release has diverged from main — it holds at least one commit that
          main does not.

          This is not something this workflow may repair. It will never merge
          and never force-push: prod deploys from release WITHOUT re-running
          checks, and that is only safe because every commit on release
          already passed checks on main. A merge or force-push here would
          deploy code that never did.

          Resolve it by hand, then re-run this workflow:

            git fetch origin
            git log --oneline origin/main..origin/release   # what release has that main doesn't

          Get those commits onto main (cherry-pick or revert them there) so
          that release becomes a strict ancestor of main again.
          MSG
          exit 1

      # The release commit now sits on release (byte-identical to main). Tag it
      # and publish a GitHub release so vX.Y.Z has a durable referent — the
      # tag is what prod points at, so it needs no sha (infrastructure.md —
      # App Versioning). Runs only if the fast-forward above succeeded.
      - name: Tag the release and publish a GitHub release
        if: steps.version.outputs.retag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          # Annotated tag on the release commit (== main HEAD, just pushed).
          git tag -a "$tag" -m "Release ${tag}"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes

      # This run deploys prod itself rather than letting the push above
      # trigger a separate job. A push authenticated with GITHUB_TOKEN does
      # not trigger further workflow runs (GitHub's recursion guard), so a
      # push-triggered deploy would never fire and this workflow would go
      # green having deployed nothing. Deploying here is what makes the
      # dispatch's success mean what it appears to mean.
      #
      # It runs only if the push above succeeded: `set -euo pipefail` plus
      # the explicit `exit 1` fails the step, and a failed step skips the
      # rest of the job by default. A diverged release is never deployed.
      # Pinned so a CLI release can't change deploy behavior under us.
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0

      - name: Deploy prod
        # The checkout is `main`, whose tree is now byte-identical to
        # release — deploying from this working copy and deploying from a
        # fresh release checkout are the same tree, by fast-forward.
        #
        # The clean prod version string (channel=prod → vX.Y.Z, no sha; the
        # tag is the referent) is baked at build time. Railway passes service
        # variables to the Dockerfile's matching ARGs, so APP_VERSION is set
        # as a variable first (--skip-deploys: the `up` below is the deploy).
        # BUILD_CHANNEL=prod is a standing service variable.
        #
        # RAILWAY_TOKEN is a project token scoped to the production
        # environment, so no --project/--environment flags are needed.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable set "APP_VERSION=${{ steps.version.outputs.version }}" --service web --skip-deploys
          railway up --ci --service web -m "Release ${{ steps.version.outputs.tag }}"

      # `up --ci` returns once the build finishes; the deployment can still
      # fail its /healthz check after that. Don't let the run go green until
      # Railway reports the deployment itself as SUCCESS.
      - name: Wait for the deployment to go live
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(railway deployment list --service web --json | jq -r '.[0].status')"
            echo "latest deployment: ${status}"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) echo "::error::Prod deployment ended ${status}"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Prod deployment did not reach SUCCESS within 5 minutes"
          exit 1
