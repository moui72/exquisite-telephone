name: CI

on:
  push:
    # `release` is deliberately absent. It only ever receives a
    # fast-forward of `main`, so its tree has already passed `checks`
    # here; and prod is deployed by promote.yml, not by anything reacting
    # to a push. Running this workflow on `release` would re-test an
    # identical tree and deploy nothing.
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

# There is deliberately NO deploy job here. Production (Railway) is
# deployed only by promote.yml, which fast-forwards `release` and deploys
# in the same manual run — see infrastructure.md, Release Promotion. A push
# to `main` or `release` therefore deploys nothing on its own.
#
# There is currently NO beta channel, and so no post-deploy cross-browser
# e2e job: both lived on Fly.io and were dropped in the move to Railway
# (infrastructure.md — Deployment). The Playwright suite still runs by
# hand against a local server (`pnpm run e2e`).
