# Weekly curation aggregation (infrastructure.md — Curation Store /
# Aggregation Pipe). The deterministic `curation:aggregate` CLI folds the
# volume's rating events into a fresh snapshot and archives the folded
# events (the MAX_CURATION_EVENTS remedy). The running server caches its
# event count once and never re-reads the directory, so after an archive
# run its cache is stale until the process restarts — this workflow
# therefore runs the aggregate and THEN restarts the app so the count
# re-seeds from the now-smaller directory (replacing the old manual
# "run in a deploy/restart window" posture).
#
# Prod only: there is no beta channel today (infrastructure.md —
# Deployment), so there is one volume to aggregate.
name: Curation aggregate

on:
  # Fixed UTC time. Target is ~Sunday 02:00 America/New_York; a cron cannot
  # follow DST, so this fires 07:00 UTC = 02:00 EST in standard time and
  # drifts to 03:00 EDT in summer (the accepted ±1h seasonal drift). Off-peak
  # either way.
  schedule:
    - cron: '0 7 * * 0'
  # Manual runs (e.g. an ad-hoc aggregate before a curation-review pass).
  workflow_dispatch:

jobs:
  aggregate-prod:
    name: Aggregate + restart prod
    runs-on: ubuntu-latest
    concurrency: curation-aggregate-prod
    # Each step normally takes seconds; a hung CLI should fail the run,
    # not hold a runner for GitHub's 6-hour default.
    timeout-minutes: 15
    env:
      # Project token scoped to the production environment.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0
      # `railway ssh` authenticates the shell with an SSH key registered on
      # the Railway account, not with the API token. RAILWAY_SSH_KEY is a
      # dedicated, passphrase-less key used only by this job.
      - name: Install the Railway SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.RAILWAY_SSH_KEY }}" > ~/.ssh/id_railway_ci
          chmod 600 ~/.ssh/id_railway_ci
      - name: Aggregate curation events (prod)
        # The slim runtime image has no `src/` and no `tsx`; run the compiled
        # entrypoint the server `tsc` build emits into `server/dist` (WORKDIR /app).
        run: timeout 300 railway ssh --service web --identity-file ~/.ssh/id_railway_ci -- node server/dist/curation/cli.js < /dev/null
      # Re-seed the server's cached event count from the now-smaller directory.
      # `--json` and a closed stdin matter: without them `railway restart`
      # restarts the service but never exits (seen with CLI 5.71.0).
      - name: Restart to refresh cached count (prod)
        run: timeout 120 railway restart --service web --yes --json < /dev/null
